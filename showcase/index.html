<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Showcase — Abba Vishnu</title>
    <meta name="description" content="A collection of motion design, product films, and visual storytelling by Abba Vishnu.">
    
    <!-- Shared Modular Stylesheet -->
    <link rel="stylesheet" href="../style.css">

    <!-- Config File & Modular Script -->
    <script src="../config.js"></script>
    <script src="../script.js" defer></script>
</head>
<body>
    <!-- Dynamic Sticky Header -->
    <header id="site-header"></header>

    <!-- Hero Section with Dynamic Banner Header -->
    <section class="hero-section">
        <div id="hero-top-bar" class="hero-top-bar" 
             data-badge="SHOWCASE · FILMS &amp; MOTION" 
             data-tagline="A complete collection of product films, brand animations, and visual stories.">
        </div>
    </section>

    <div class="container">

        <!-- Back Button instance -->
        <div id="back-button-container" style="margin-bottom: 32px;"></div>

        <!-- Full Video Collection Grid (Dynamically Populated from config.js) -->
        <section id="full-showcase" style="margin-top: 0;">
            <div class="grid" id="vimeo-grid-container">
                <!-- JavaScript automatically populates YouTube & Vimeo cards here -->
            </div>
        </section>

        <!-- Footer -->
        <div class="footer-bottom" style="margin-top: 80px;">
            <p>&copy; 2026 <span id="footer-name">Abba Vishnu</span> &bull; Visual design, in motion.</p>
        </div>
    </div>
</body>
</html>
