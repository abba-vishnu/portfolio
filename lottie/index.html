<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Lottie — Abba Vishnu</title>
    <meta name="description" content="Lottie animation experiments by Abba Vishnu.">

    <!-- Shared Modular Stylesheet -->
    <link rel="stylesheet" href="../style.css">

    <!-- Order matters: config, then the Lottie player, then the main script -->
    <script src="../config.js"></script>
    <script src="../lottie.js"></script>
    <script src="../script.js" defer></script>
</head>
<body>
    <!-- Menu Bar Header -->
    <header id="site-header"></header>

    <!-- Hero Section with Dynamic Banner Header -->
    <section class="hero-section">
        <div id="hero-top-bar" class="hero-top-bar"
             data-badge="WORKBOOK · LOTTIE ANIMATIONS"
             data-tagline="Lightweight vector animations, built for the web.">
        </div>
    </section>

    <div class="container">
        <!-- Back Button instance -->
        <div id="back-button-container" style="margin-bottom: 32px;"></div>

        <!-- Auto-generated from SITE_CONFIG.lottieFiles (no data-limit = show all) -->
        <div class="grid" id="lottie-grid-container" style="margin-top: 0;"></div>

        <!-- Footer -->
        <div class="footer-bottom" style="margin-top: 80px;">
            <p>&copy; 2026 <span id="footer-name">Abba Vishnu</span> &bull; Visual design, in motion.</p>
        </div>
    </div>
</body>
</html>
